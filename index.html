<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thư Viện Biểu Mẫu Word Thông Minh</title>
    <meta name="description" content="Ứng dụng quản lý, cấu hình dòng văn bản động và điền nhanh biểu mẫu Microsoft Word (.docx) trực tuyến." />
    <meta property="og:title" content="Thư Viện Biểu Mẫu Word Thông Minh" />
    <meta property="og:description" content="Ứng dụng quản lý, cấu hình dòng văn bản động và điền nhanh biểu mẫu Microsoft Word (.docx) trực tuyến." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script>
      // Tự động nạp bản build sẵn trong ./docs/ nếu GitHub Pages đang cấu hình trỏ trực tiếp vào nhánh main / (root)
      if (window.location.hostname.endsWith('github.io')) {
        window.addEventListener('DOMContentLoaded', function () {
          var rawEntry = document.querySelector('script[src*="/src/main.tsx"]');
          if (rawEntry) {
            var css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = './docs/assets/index.css';
            document.head.appendChild(css);

            var js = document.createElement('script');
            js.type = 'module';
            js.src = './docs/assets/app.js';
            document.body.appendChild(js);
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
